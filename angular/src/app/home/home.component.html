<div class="container py-5">
  <h1 class="display-5 fw-bold">{{ '::AppName' | abpLocalization }}</h1>
  <p class="lead text-muted">{{ '::LongWelcomeMessage' | abpLocalization }}</p>

  @if (!hasLoggedIn) {
    <a (click)="login()" class="btn btn-primary">
      <i class="fa-solid fa-right-to-bracket me-1"></i>
      <span>{{ 'AbpAccount::Login' | abpLocalization }}</span>
    </a>
  }
</div>
